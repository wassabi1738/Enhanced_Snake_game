<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🐍 Snake Game</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <style>
        /* ─── Global ─── */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* ─── Game wrapper ─── */
        .game-wrapper {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 30px 30px 35px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.08);
            max-width: 520px;
            width: 100%;
        }

        /* ─── Canvas ─── */
        #gameCanvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0,255,136,0.15), inset 0 0 30px rgba(0,0,0,0.4);
            background: #111;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
        }

        /* ─── HUD ─── */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 6px 6px;
            color: #e0e0e0;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .hud span { background: rgba(255,255,255,0.06); padding: 4px 14px; border-radius: 40px; }

        /* ─── Screens (overlay) ─── */
        .screen-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            background: rgba(0,0,0,0.72);
            backdrop-filter: blur(6px);
            transition: opacity 0.35s ease;
            z-index: 10;
        }
        .screen-overlay.hidden { opacity: 0; pointer-events: none; }

        .screen-overlay h1 { font-size: 2.4rem; margin-bottom: 6px; }
        .screen-overlay .subtitle { color: #aaa; margin-bottom: 20px; font-size: 0.95rem; }

        /* ─── Difficulty buttons ─── */
        .diff-group { display: flex; gap: 10px; margin: 14px 0 20px; flex-wrap: wrap; justify-content: center; }
        .diff-btn {
            padding: 8px 22px;
            border-radius: 40px;
            border: 2px solid transparent;
            background: rgba(255,255,255,0.07);
            color: #ccc;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .diff-btn:hover { background: rgba(255,255,255,0.14); }
        .diff-btn.active {
            border-color: #4ade80;
            color: #4ade80;
            background: rgba(74,222,128,0.13);
            box-shadow: 0 0 16px rgba(74,222,128,0.25);
        }

        /* ─── Action button ─── */
        .action-btn {
            padding: 12px 48px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #0a0a1a;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 4px 20px rgba(74,222,128,0.35);
            letter-spacing: 0.5px;
        }
        .action-btn:hover { transform: scale(1.04); box-shadow: 0 6px 30px rgba(74,222,128,0.5); }
        .action-btn:active { transform: scale(0.97); }
        .action-btn.secondary {
            background: rgba(255,255,255,0.08);
            color: #ddd;
            box-shadow: none;
            margin-left: 10px;
        }
        .action-btn.secondary:hover { background: rgba(255,255,255,0.16); }

        /* ─── Misc ─── */
        .score-display { font-size: 1.8rem; font-weight: 700; color: #facc15; margin: 4px 0; }
        .hs-label { color: #888; font-size: 0.85rem; }
        .game-over-emoji { font-size: 3rem; margin-bottom: 4px; }

        .canvas-wrap {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- HUD -->
    <div class="hud">
        <span>🍎 <span id="scoreDisplay">0</span></span>
        <span>🏆 <span id="highScoreDisplay">0</span></span>
    </div>

    <!-- Canvas -->
    <div class="canvas-wrap">
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <!-- ── START SCREEN ── -->
        <div id="startScreen" class="screen-overlay" style="z-index:20;">
            <h1 style="color:#4ade80;">🐍 Snake</h1>
            <p class="subtitle">Eat food, grow longer, don't crash!</p>

            <div style="color:#bbb; font-size:0.85rem; margin-bottom:2px;">Difficulty</div>
            <div class="diff-group">
                <button class="diff-btn" data-speed="180">Easy</button>
                <button class="diff-btn active" data-speed="120">Medium</button>
                <button class="diff-btn" data-speed="70">Hard</button>
                <button class="diff-btn" data-speed="40">🔥 Insane</button>
            </div>

            <button id="startBtn" class="action-btn">▶  Start Game</button>
        </div>

        <!-- ── GAME OVER SCREEN ── -->
        <div id="gameOverScreen" class="screen-overlay hidden" style="z-index:15;">
            <div class="game-over-emoji">💀</div>
            <h1 style="color:#f87171;">Game Over</h1>
            <div class="score-display" id="finalScore">0</div>
            <div class="hs-label">High Score: <span id="finalHighScore">0</span></div>
            <div style="margin-top:22px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
                <button id="restartBtn" class="action-btn">🔄  Play Again</button>
                <button id="menuBtn" class="action-btn secondary">🏠  Menu</button>
            </div>
        </div>
    </div>
</div>

<script>
// ══════════════════════════════════════════════════
//  SNAKE GAME — Full Enhanced Version
// ══════════════════════════════════════════════════

// ─── DOM refs ───
const canvas      = document.getElementById('gameCanvas');
const ctx         = canvas.getContext('2d');
const scoreEl     = document.getElementById('scoreDisplay');
const hsEl        = document.getElementById('highScoreDisplay');
const finalScore  = document.getElementById('finalScore');
const finalHs     = document.getElementById('finalHighScore');

const startScreen  = document.getElementById('startScreen');
const gameOverScr  = document.getElementById('gameOverScreen');

const startBtn     = document.getElementById('startBtn');
const restartBtn   = document.getElementById('restartBtn');
const menuBtn      = document.getElementById('menuBtn');
const diffBtns     = document.querySelectorAll('.diff-btn');

// ─── Audio context (sound effects) ───
let audioCtx = null;
function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}

function playTone(freq, duration, type = 'square', volume = 0.12) {
    try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(volume, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
    } catch (_) { /* fail silently */ }
}

function soundEat() {
    playTone(600, 0.08, 'square', 0.10);
    setTimeout(() => playTone(900, 0.08, 'square', 0.08), 60);
}

function soundDie() {
    playTone(300, 0.20, 'sawtooth', 0.10);
    setTimeout(() => playTone(200, 0.25, 'sawtooth', 0.08), 120);
    setTimeout(() => playTone(120, 0.35, 'sawtooth', 0.06), 260);
}

function soundStart() {
    playTone(440, 0.10, 'square', 0.08);
    setTimeout(() => playTone(660, 0.10, 'square', 0.08), 80);
    setTimeout(() => playTone(880, 0.12, 'square', 0.08), 160);
}

// ─── Game constants ───
const GRID      = 20;
const TILE      = canvas.width / GRID;   // 20

// ─── Game state ───
let snake, food, dx, dy, score, highScore, speed, gameRunning, gameLoopId;

// ─── Init ───
function initGame() {
    const mid = Math.floor(GRID / 2);
    snake = [{x: mid, y: mid}];
    dx = 1; dy = 0;
    score = 0;
    scoreEl.textContent = '0';
    placeFood();
}

function placeFood() {
    let pos;
    do {
        pos = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
}

// ─── Difficulty ───
function getSelectedSpeed() {
    const active = document.querySelector('.diff-btn.active');
    return active ? parseInt(active.dataset.speed) : 120;
}

diffBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        diffBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    });
});

// ─── High score (localStorage) ───
function loadHighScore() {
    try { return parseInt(localStorage.getItem('snakeHighScore')) || 0; } catch { return 0; }
}
function saveHighScore(val) {
    try { localStorage.setItem('snakeHighScore', val); } catch { /* noop */ }
}
highScore = loadHighScore();
hsEl.textContent = highScore;

// ─── Drawing ───

function draw() {
    const w = canvas.width, h = canvas.height;

    // 1. Background gradient
    const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w*0.75);
    grad.addColorStop(0, '#1a2a2a');
    grad.addColorStop(1, '#0a0f0f');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // 2. Subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID; i++) {
        const p = i * TILE;
        ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(w, p); ctx.stroke();
    }

    // 3. Food — pulsing glow
    const pulse = 0.9 + 0.1 * Math.sin(Date.now() / 180);
    const fx = food.x * TILE + TILE/2;
    const fy = food.y * TILE + TILE/2;
    const fr = (TILE/2 - 2) * pulse;

    // glow
    const glow = ctx.createRadialGradient(fx, fy, 0, fx, fy, TILE);
    glow.addColorStop(0, 'rgba(255,80,80,0.35)');
    glow.addColorStop(1, 'rgba(255,80,80,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(fx, fy, TILE, 0, Math.PI*2); ctx.fill();

    // apple shape
    ctx.shadowColor = '#ff444466';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ff4455';
    ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#cc2233';
    ctx.beginPath(); ctx.arc(fx-3, fy-3, fr*0.35, 0, Math.PI*2); ctx.fill();
    // stem
    ctx.strokeStyle = '#5a3a1a';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.moveTo(fx, fy - fr); ctx.lineTo(fx+2, fy - fr - 5); ctx.stroke();
    // leaf
    ctx.fillStyle = '#4ade80';
    ctx.beginPath(); ctx.ellipse(fx+4, fy - fr - 3, 3, 2, 0.3, 0, Math.PI*2); ctx.fill();

    ctx.shadowBlur = 0;

    // 4. Snake — gradient body with rounded segments
    snake.forEach((seg, i) => {
        const x = seg.x * TILE, y = seg.y * TILE;
        const pad = 1;
        const size = TILE - pad * 2;
        const ratio = i / Math.max(snake.length - 1, 1);

        // colour gradient: head is bright green, tail darker
        const r = Math.round(20 + 30 * ratio);
        const g = Math.round(200 - 60 * ratio);
        const b = Math.round(60 + 20 * ratio);
        ctx.fillStyle = `rgb(${r},${g},${b})`;

        // glow on head
        if (i === 0) {
            ctx.shadowColor = '#4ade8066';
            ctx.shadowBlur = 14;
        } else {
            ctx.shadowBlur = 0;
        }

        // rounded rect
        const radius = 5;
        ctx.beginPath();
        ctx.moveTo(x + pad + radius, y + pad);
        ctx.lineTo(x + pad + size - radius, y + pad);
        ctx.quadraticCurveTo(x + pad + size, y + pad, x + pad + size, y + pad + radius);
        ctx.lineTo(x + pad + size, y + pad + size - radius);
        ctx.quadraticCurveTo(x + pad + size, y + pad + size, x + pad + size - radius, y + pad + size);
        ctx.lineTo(x + pad + radius, y + pad + size);
        ctx.quadraticCurveTo(x + pad, y + pad + size, x + pad, y + pad + size - radius);
        ctx.lineTo(x + pad, y + pad + radius);
        ctx.quadraticCurveTo(x + pad, y + pad, x + pad + radius, y + pad);
        ctx.closePath();
        ctx.fill();
    });

    // eyes on head
    if (snake.length > 0) {
        const head = snake[0];
        const hx = head.x * TILE + TILE/2;
        const hy = head.y * TILE + TILE/2;
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        let e1x, e1y, e2x, e2y;
        if (dx === 1)  { e1x=6;  e1y=-3; e2x=6;  e2y=4; }
        else if (dx===-1){ e1x=-6; e1y=-3; e2x=-6; e2y=4; }
        else if (dy===-1){ e1x=-3; e1y=-6; e2x=3;  e2y=-6; }
        else            { e1x=-3; e1y=6;  e2x=3;  e2y=6; }
        ctx.beginPath(); ctx.arc(hx+e1x, hy+e1y, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(hx+e2x, hy+e2y, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(hx+e1x+dx*1.2, hy+e1y+dy*1.2, 1.2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(hx+e2x+dx*1.2, hy+e2y+dy*1.2, 1.2, 0, Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 0;
}

// ─── Update ───
function update() {
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };

    // Wall collision
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        gameOver(); return;
    }
    // Self collision
    for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
            gameOver(); return;
        }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        soundEat();
        placeFood();
    } else {
        snake.pop();
    }
}

// ─── Game loop ───
function gameLoop() {
    if (!gameRunning) return;
    update();
    draw();
    gameLoopId = setTimeout(gameLoop, speed);
}

// ─── Start / Stop ───
function startGame() {
    speed = getSelectedSpeed();
    soundStart();
    initGame();
    gameRunning = true;
    startScreen.classList.add('hidden');
    gameOverScr.classList.add('hidden');
    draw();
    if (gameLoopId) clearTimeout(gameLoopId);
    gameLoopId = setTimeout(gameLoop, speed);
}

function gameOver() {
    gameRunning = false;
    if (gameLoopId) { clearTimeout(gameLoopId); gameLoopId = null; }
    soundDie();

    // Update high score
    if (score > highScore) {
        highScore = score;
        saveHighScore(highScore);
        hsEl.textContent = highScore;
    }

    finalScore.textContent = score;
    finalHs.textContent   = highScore;
    gameOverScr.classList.remove('hidden');

    // Draw one last frame so player sees the collision
    draw();
}

function goToMenu() {
    gameRunning = false;
    if (gameLoopId) { clearTimeout(gameLoopId); gameLoopId = null; }
    gameOverScr.classList.add('hidden');
    startScreen.classList.remove('hidden');
    drawStartPreview();
}

// ─── Preview on start screen ───
function drawStartPreview() {
    // simple static preview
    const w = canvas.width, h = canvas.height;
    const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w*0.75);
    grad.addColorStop(0, '#1a2a2a');
    grad.addColorStop(1, '#0a0f0f');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // draw a little static snake
    const previewSnake = [{x:8,y:10},{x:7,y:10},{x:6,y:10},{x:5,y:10}];
    previewSnake.forEach((seg, i) => {
        const x = seg.x * TILE, y = seg.y * TILE;
        const r = Math.round(20 + 40 * i / 3);
        const g = Math.round(200 - 60 * i / 3);
        ctx.fillStyle = `rgb(${r},${g},60)`;
        ctx.shadowBlur = i === 0 ? 12 : 0;
        ctx.shadowColor = '#4ade8044';
        ctx.beginPath(); ctx.roundRect(x+1, y+1, TILE-2, TILE-2, 5); ctx.fill();
    });
    // food
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff4455';
    ctx.beginPath(); ctx.arc(13*TILE+TILE/2, 10*TILE+TILE/2, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#cc2233';
    ctx.beginPath(); ctx.arc(13*TILE+TILE/2-2, 10*TILE+TILE/2-2, 3, 0, Math.PI*2); ctx.fill();
}

// polyfill roundRect if needed
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (r > w/2) r = w/2; if (r > h/2) r = h/2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        return this;
    };
}

// ─── Keyboard ───
document.addEventListener('keydown', (e) => {
    if (!gameRunning) return;
    const key = e.key;
    const goingUp = dy === -1, goingDown = dy === 1;
    const goingRight = dx === 1, goingLeft = dx === -1;

    if ((key === 'ArrowUp' || key === 'w' || key === 'W') && !goingDown)    { dx=0; dy=-1; }
    if ((key === 'ArrowDown' || key === 's' || key === 'S') && !goingUp)    { dx=0; dy=1; }
    if ((key === 'ArrowLeft' || key === 'a' || key === 'A') && !goingRight) { dx=-1; dy=0; }
    if ((key === 'ArrowRight' || key === 'd' || key === 'D') && !goingLeft) { dx=1; dy=0; }
    // Prevent arrow keys from scrolling the page
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key)) e.preventDefault();
});

// ─── Button events ───
startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);
menuBtn.addEventListener('click', goToMenu);

// ─── Kick off ───
drawStartPreview();
</script>
</body>
</html>
